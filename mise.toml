[tools]
"ubi:mikefarah/yq" = { version = "latest", exe = "yq" }
terraform = "1.15.8"
doctl = "latest"
op = "latest"
helm = "latest"
helmfile = "latest"
kubectl = "latest"
# kubectl cnpg, pinned to the operator version in cluster/helmfile.yaml
# Pulls remark42 backups out of R2, see runbooks/remark42-restore
rclone = "1.75.2"
"ubi:cloudnative-pg/cloudnative-pg" = { version = "1.30.1", exe = "kubectl-cnpg", matching = "kubectl-cnpg" }

[task_config]
includes = ["scripts"]
