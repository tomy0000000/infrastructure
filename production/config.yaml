# Cloudflare zones
zones:
  main: tomy.me

# R2 buckets
buckets:
  img:
    name: tomy-img
    location: APAC
    access_hosts:
      # Must include scheme
      - https://blog.tomy.me
      - https://docs.tomy.me
      - http://localhost:1313
      - http://0.0.0.0:1313
    bucket_hosts:
      # Must not include scheme
      # Must be a subdomain of the main zone
      - img.tomy.me
  misc:
    name: tomy-misc
    location: APAC
  # CloudNativePG base backups and WAL archive
  postgres:
    name: tomy-postgres
    location: WNAM
  # ClickHouse backups of the Plausible events database, a full one a day
  clickhouse:
    name: tomy-clickhouse
    location: WNAM
    expire_after_days: 30
  # Nightly copies of remark42's data directory, one folder per run
  remark42:
    name: tomy-backup-remark42
    location: WNAM
    expire_after_days: 30

# DOKS cluster
kubernetes:
  name: endurance
  region: sfo3
  version_prefix: "1.36."
  ha: false
  auto_upgrade: true
  node:
    size: s-2vcpu-4gb-amd
    min: 1
    max: 3

# Mailcow Linode instances
instances:
  mailcow:
    name: mailcow
    region: us-west
    type: g6-standard-2
    private_ip: false
    backups_enabled: true
    hostname: mailcow.tomy.me
    image: linode/ubuntu26.04
    authorized_users:
      - tomyhsieh
    mailcow_version: 2026-09a
    timezone: Asia/Taipei
    mail_domain: tomy.me
    dkim_selector: dkim2026
    dkim_public_key: 
    dmarc_rua:
      - 7d9c53bbd290497aa6e858ade447d141@dmarc-reports.cloudflare.net
      - postmaster@tomy.me
    tlsa_spki_sha256: ad3181fa38b9396ba30a9833bb1f4441890ade652f3e6f5d19fbaee2a7399482
