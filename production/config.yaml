# Cloudflare zones
zones:
  main: tomy.me

# R2 buckets
buckets:
  img:
    name: tomy-img
    location: APAC
    access_hosts:
      # Must include scheme
      - https://blog.tomy.me
      - https://docs.tomy.me
      - http://localhost:1313
      - http://0.0.0.0:1313
    bucket_hosts:
      # Must not include scheme
      # Must be a subdomain of the main zone
      - img.tomy.me
  misc:
    name: tomy-misc
    location: APAC

# DOKS cluster
kubernetes:
  name: endurance
  region: sfo3
  version_prefix: "1.36."
  ha: false
  auto_upgrade: true
  node:
    size: s-1vcpu-2gb
    min: 1
    max: 3
