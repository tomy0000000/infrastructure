apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
      namespace: {{ .Values.gatewayNamespace }}
      sectionName: https
  # No hostnames would match every host on the listener, so refuse it.
  hostnames:
{{- if not .Values.httpRoute.hostnames }}
{{- fail "httpRoute.hostnames must list at least one host" }}
{{- end }}
{{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    - backendRefs:
        - name: {{ required "httpRoute.service is required" .Values.httpRoute.service }}
          port: {{ required "httpRoute.port is required" .Values.httpRoute.port }}
