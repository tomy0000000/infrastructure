{{- /* httpRoutes renders one route per key, named <release>-<key>, for apps serving several hosts. */}}
{{- $routes := dict .Release.Name .Values.httpRoute }}
{{- with .Values.httpRoutes }}
{{- $routes = dict }}
{{- range $key, $route := . }}
{{- $_ := set $routes (printf "%s-%s" $.Release.Name $key) $route }}
{{- end }}
{{- end }}
{{- range $name, $route := $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.gatewayName }}
      namespace: {{ $.Values.gatewayNamespace }}
      sectionName: https
  # No hostnames would match every host on the listener, so refuse it.
  hostnames:
{{- if not $route.hostnames }}
{{- fail "httpRoute.hostnames must list at least one host" }}
{{- end }}
{{- range $route.hostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    - backendRefs:
        - name: {{ required "httpRoute.service is required" $route.service }}
          port: {{ required "httpRoute.port is required" $route.port }}
{{- with $route.requestTimeout }}
      timeouts:
        request: {{ . | quote }}
{{- end }}
{{- end }}
