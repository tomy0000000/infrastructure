# Environments reuse the Terraform config files so each environment keeps one
# source of truth.
environments:
  staging:
    values:
      - ../staging/config.yaml
  production:
    values:
      - ../production/config.yaml

---
repositories:
  - name: jetstack
    url: https://charts.jetstack.io
  - name: external-dns
    url: https://kubernetes-sigs.github.io/external-dns/
  - name: uptime-kuma
    url: https://dirsigler.github.io/uptime-kuma-helm
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: tomy0000000
    url: https://charts.tomy.me
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts

releases:
  ## Platform: shared services every app depends on.

  # Envoy Gateway CRDs and controller
  - name: envoy-gateway
    namespace: envoy-gateway-system
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: 1.9.1
    hooks:
      - events: [presync]
        showlogs: true
        command: ./scripts/apply-gateway-crds.sh
        args: ["{{ .Release.Version }}"]
    values:
      - platform/values/envoy-gateway.yaml

  # Reads Gateway API CRDs at startup, so it lands after the release that installs them
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: 1.21.2
    needs:
      - envoy-gateway-system/envoy-gateway
    values:
      - platform/values/cert-manager.yaml

  # Signs CertificateRequests with Cloudflare Origin CA, through cert-manager's approver
  - name: origin-ca-issuer
    namespace: origin-ca-issuer
    chart: oci://ghcr.io/cloudflare/origin-ca-issuer-charts/origin-ca-issuer
    version: 0.6.9
    needs:
      - cert-manager/cert-manager
    # The chart ships no CRDs, they come from its repo at the matching appVersion.
    hooks:
      - events: [presync]
        showlogs: true
        command: ./scripts/apply-origin-ca-crds.sh
        args: ["{{ .Release.Version }}"]
    values:
      - platform/values/origin-ca-issuer.yaml

  # Fetches every workload Secret from 1Password. Its own token is the one exception
  - name: external-secrets
    namespace: external-secrets
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.11.0
    values:
      - platform/values/external-secrets.yaml.gotmpl

  # Publishes a proxied Cloudflare record for every HTTPRoute hostname
  - name: external-dns
    namespace: external-dns
    chart: external-dns/external-dns
    version: 1.22.0
    needs:
      - envoy-gateway-system/envoy-gateway
    values:
      - platform/values/external-dns.yaml.gotmpl

  # CloudNativePG operator and its CRDs, which run every Postgres cluster
  - name: cloudnative-pg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    version: 0.29.1
    values:
      - platform/values/cloudnative-pg.yaml

  # Backs up every Postgres cluster to object storage, in the operator's namespace as CNPG-I requires
  - name: plugin-barman-cloud
    namespace: cnpg-system
    chart: cnpg/plugin-barman-cloud
    version: 0.8.0
    needs:
      - cert-manager/cert-manager
      - cnpg-system/cloudnative-pg
    # Renders cert-manager kinds, absent on an empty cluster
    disableValidationOnInstall: true
    values:
      - platform/values/plugin-barman-cloud.yaml

  # The shared Postgres every app gets a database in, archiving to R2
  - name: postgres
    namespace: postgres
    chart: ./platform/charts/postgres
    needs:
      - cnpg-system/plugin-barman-cloud
      - gateway/cluster-config
    # Renders CNPG, barman-cloud and ESO kinds, absent on an empty cluster
    disableValidationOnInstall: true
    values:
      - platform/values/postgres.yaml.gotmpl

  # Cluster-scoped objects no chart ships: GatewayClass, Gateway, ClusterSecretStore, issuer, wildcard cert
  - name: cluster-config
    namespace: gateway
    chart: ./platform/charts/cluster-config
    # Renders kinds other releases install, absent on an empty cluster
    disableValidationOnInstall: true
    needs:
      - envoy-gateway-system/envoy-gateway
      - cert-manager/cert-manager
      - origin-ca-issuer/origin-ca-issuer
      - external-secrets/external-secrets
      - external-dns/external-dns
    values:
      - platform/values/cluster-config.yaml.gotmpl

  ## Apps: third-party charts, versions pinned by hand.

  - name: uptime-kuma
    namespace: uptime-kuma
    chart: uptime-kuma/uptime-kuma
    version: 4.2.0
    needs:
      - gateway/cluster-config
    values:
      - apps/values/uptime-kuma.yaml.gotmpl

  # Its HTTPRoute, from the same values file, so a failure elsewhere cannot block it
  - name: uptime-kuma-route
    namespace: uptime-kuma
    chart: ./apps/charts/route
    # Renders a kind another release installs, absent on an empty cluster
    disableValidationOnInstall: true
    needs:
      - uptime-kuma/uptime-kuma
    values:
      - apps/values/uptime-kuma.yaml.gotmpl

  # Prometheus, Grafana, node-exporter and kube-state-metrics, behind one version pin
  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 91.7.1
    needs:
      - gateway/cluster-config
    hooks:
      - events: [presync]
        showlogs: true
        command: ./scripts/apply-prometheus-crds.sh
        args: ["{{ .Release.Version }}"]
    # Renders the operator's own kinds and an ExternalSecret, absent until the hook and ESO land
    disableValidationOnInstall: true
    values:
      - apps/values/kube-prometheus-stack.yaml.gotmpl

  # Its HTTPRoute, from the same values file, so a failure elsewhere cannot block it
  - name: kube-prometheus-stack-route
    namespace: monitoring
    chart: ./apps/charts/route
    # Renders a kind another release installs, absent on an empty cluster
    disableValidationOnInstall: true
    needs:
      - monitoring/kube-prometheus-stack
    values:
      - apps/values/kube-prometheus-stack.yaml.gotmpl

  # mcp-email-server behind its token-checking Caddy sidecar, reading the mailcow mailbox over IMAP
  - name: email-mcp
    namespace: email-mcp
    chart: tomy0000000/email-mcp
    version: 0.1.1
    needs:
      - gateway/cluster-config
    # Renders ExternalSecrets, absent until ESO lands
    disableValidationOnInstall: true
    values:
      - apps/values/email-mcp.yaml.gotmpl

  # Its HTTPRoute, from the same values file, so a failure elsewhere cannot block it
  - name: email-mcp-route
    namespace: email-mcp
    chart: ./apps/charts/route
    # Renders a kind another release installs, absent on an empty cluster
    disableValidationOnInstall: true
    needs:
      - email-mcp/email-mcp
    values:
      - apps/values/email-mcp.yaml.gotmpl
