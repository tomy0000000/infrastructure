# Environments reuse the Terraform config files so each environment keeps one
# source of truth.
environments:
  staging:
    values:
      - ../staging/config.yaml
  production:
    values:
      - ../production/config.yaml

---
repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  ## Platform: shared services every app depends on.

  # Envoy Gateway CRDs and controller
  - name: envoy-gateway
    namespace: envoy-gateway-system
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: 1.9.1
    hooks:
      - events: [presync]
        showlogs: true
        command: ./scripts/apply-gateway-crds.sh
        args: ["{{ .Release.Version }}"]
    values:
      - platform/values/envoy-gateway.yaml

  # Reads Gateway API CRDs at startup, so it lands after the release that installs them
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: 1.21.2
    needs:
      - envoy-gateway-system/envoy-gateway
    values:
      - platform/values/cert-manager.yaml

  # Cluster-scoped Envoy GatewayClass
  - name: cluster-config
    namespace: gateway
    chart: ./platform/charts/cluster-config
    needs:
      - envoy-gateway-system/envoy-gateway
    values:
      - platform/values/cluster-config.yaml.gotmpl
