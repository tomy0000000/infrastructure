crds:
  enabled: true

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
webhook:
  # DOKS blocks upgrades on webhook timeouts above 29s, and the chart defaults to 30
  timeoutSeconds: 29
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
