# Cluster name, the first part of every 1Password item name ESO fetches.
cluster: ""
# Cloudflare account that owns the bucket, part of the R2 endpoint.
accountId: ""
bucket: ""
# Folder in the bucket this cluster archives to. CNPG refuses to archive into
# one another cluster already wrote, so a restored cluster needs a new one.
serverName: ""
# Folder to restore from when the cluster is created. Empty starts a new database.
recoverFrom: ""
# Apps that get a database of their own, owned by a login role of the same
# name. The role's password is the 1Password item <cluster>-postgres-<name>.
databases: []
