apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  storage:
    size: 5Gi
    # Retain: an uninstall keeps the DO volume, on top of the R2 backups.
    storageClass: do-block-storage-retain
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2
        serverName: {{ required "serverName is required" .Values.serverName }}
  {{- with .Values.recoverFrom }}
  # Read only when the cluster is created, ignored afterwards.
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2
          serverName: {{ . }}
  {{- end }}
