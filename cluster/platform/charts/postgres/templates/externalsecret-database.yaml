{{- range .Values.databases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: main-{{ . }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: main-{{ . }}
    creationPolicy: Owner
    # The shape CNPG reads a role password from. The username must be the role.
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ . | quote }}
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "cluster is required" $.Values.cluster }}-postgres-{{ . }}/credential
{{- end }}
