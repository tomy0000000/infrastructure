# Lands next to the ClusterOriginIssuer that consumes it, in the controller's namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-key
  namespace: origin-ca-issuer
spec:
  # Family plan: 1,000 reads per day across the account, so hourly, never the 1m of the examples.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: {{ required "cluster is required" .Values.cluster }}-cloudflare-origin_ca/credential
