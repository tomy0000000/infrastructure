# Every workload Secret is an ExternalSecret against this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: Develop
      # Absorbs reconcile retries so they don't spend the daily read budget.
      cache:
        ttl: 1h
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
          namespace: external-secrets
