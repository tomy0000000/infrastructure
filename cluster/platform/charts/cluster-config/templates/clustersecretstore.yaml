# Every workload Secret is an ExternalSecret against this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: Develop
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          key: token
          namespace: external-secrets
