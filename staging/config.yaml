# Mailcow Linode instances
instances:
  mailcow:
    name: mailcow-staging
    region: ap-northeast
    type: g6-standard-1
    private_ip: true
    backups_enabled: true
    hostname: mailcow.tomy.tech
    image: linode/ubuntu26.04
    authorized_users:
      - tomyhsieh
